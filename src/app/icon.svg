<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 핑크 배경 원 그라데이션 -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>

    <!-- 골드 링 그라데이션 -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- 1. 부드러운 핑크 원형 배경 -->
  <circle cx="32" cy="32" r="30" fill="url(#fav-bg)"/>

  <!-- 2. 다이아몬드 상단 반짝임 -->
  <path d="M 32 6 L 34 11 L 39 11 L 35 14 L 37 19 L 32 16 L 27 19 L 29 14 L 25 11 L 30 11 Z" fill="#FFF8E1"/>

  <!-- 3. 골드 반지 링 -->
  <circle cx="32" cy="38" r="15" fill="none" stroke="url(#fav-gold)" stroke-width="5"/>

  <!-- 4. 다이아몬드 보석 -->
  <polygon points="32,18 22,25 32,32 42,25" fill="#E0F7FA"/>
  <polygon points="22,25 32,18 32,32" fill="#B2EBF2"/>
  <polygon points="32,18 42,25 32,22" fill="#E0F7FA"/>
</svg>
